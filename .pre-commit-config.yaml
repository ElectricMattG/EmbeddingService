default_language_version:
  python: python3
repos:
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0 # keep in sync with dev-requirements.in
    hooks:
      - id: isort
        args:
          - --resolve-all-configs
  - repo: https://github.com/psf/black
    rev: 23.3.0 # keep in sync with dev-requirements.in
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=88
          - --ignore=E203,E501,W503
          - --per-file-ignores=__init__.py:F401
        additional_dependencies: [flake8-tidy-imports]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.1.1
    hooks:
      - id: mypy
        name: mypy [checks]
        args:
          - --ignore-missing-imports
        exclude: setup.py
  - repo: https://github.com/nvuillam/npm-groovy-lint
    rev: v10.1.0
    # Be careful when bumping this version. v11.1.1 somehow tries linting other files
    # within it's own pre-commit repo, causing the hook to fail for files we don't
    # control
    hooks:
      - id: npm-groovy-lint
      - id: fix-npm-groovy-lint
      - id: format-npm-groovy-lint
  # TODO: metrics validation hook
