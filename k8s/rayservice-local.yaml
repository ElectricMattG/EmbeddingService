apiVersion: ray.io/v1
kind: RayService
metadata:
  name: embedding-service
  namespace: default
spec:
  serviceUnhealthySecondThreshold: 900
  deploymentUnhealthySecondThreshold: 300

  # Ray Serve application configuration
  serveConfigV2: |
    http_options:
      host: "0.0.0.0"
      port: 8000
      location: EveryNode
    applications:
      - name: embedding-service
        import_path: src.service.ray_deployment:deployment
        route_prefix: "/"

  # Ray Cluster configuration
  rayClusterConfig:
    rayVersion: '2.39.0'

    # Head node - no GPU, used for coordination
    headGroupSpec:
      serviceType: ClusterIP
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: '0'
      template:
        spec:
          terminationGracePeriodSeconds: 120
          containers:
          - name: ray-head
            image: 192.168.1.3:5000/embedding-service:4.1.2
            imagePullPolicy: Always  # Pull pinned image from local registry
            ports:
            - containerPort: 6379
              name: gcs
              protocol: TCP
            - containerPort: 8265
              name: dashboard
              protocol: TCP
            - containerPort: 10001
              name: client
              protocol: TCP
            - containerPort: 8000
              name: serve
              protocol: TCP
            resources:
              limits:
                cpu: "500m"
                memory: "2Gi"
              requests:
                cpu: "250m"
                memory: "1Gi"
            lifecycle:
              preStop:
                exec:
                  command:
                    - /bin/bash
                    - -lc
                    - |
                      echo "[preStop] Gracefully stopping Ray head...";
                      ray stop || true;
                      pkill -TERM -f "python.*ray" || true;
                      pkill -TERM -f "uvicorn|fastapi|gunicorn" || true;
                      sleep 5
            volumeMounts:
            - name: ray-storage
              mountPath: /mnt/ray-storage
            env:
            - name: RAY_STORAGE_PATH
              value: "/mnt/ray-storage"
            - name: TRANSFORMERS_CACHE
              value: "/root/.cache/huggingface"
          volumes:
          - name: ray-storage
            persistentVolumeClaim:
              claimName: ray-storage-pvc

    # Worker nodes - GPU enabled for embedding operations
    workerGroupSpecs:
    - groupName: worker-gpu
      replicas: 1
      minReplicas: 1
      maxReplicas: 1
      rayStartParams:
        num-gpus: '1'
      template:
        spec:
          terminationGracePeriodSeconds: 120
          containers:
          - name: ray-worker
            image: 192.168.1.3:5000/embedding-service:4.1.2
            imagePullPolicy: Always  # Pull pinned image from local registry
            readinessProbe:
              exec:
                command:
                  - bash
                  - -c
                  - wget --tries 1 -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 3
            resources:
              limits:
                cpu: "3"
                memory: "8Gi"
                nvidia.com/gpu: "1"
              requests:
                cpu: "2"
                memory: "4Gi"
                nvidia.com/gpu: "1"
            lifecycle:
              preStop:
                exec:
                  command:
                    - /bin/bash
                    - -lc
                    - |
                      echo "[preStop] Gracefully stopping Ray worker...";
                      ray stop || true;
                      pkill -TERM -f "python.*ray" || true;
                      pkill -TERM -f "uvicorn|fastapi|gunicorn" || true;
                      sleep 5
            volumeMounts:
            - name: ray-storage
              mountPath: /mnt/ray-storage
            env:
            - name: RAY_STORAGE_PATH
              value: "/mnt/ray-storage"
            - name: TRANSFORMERS_CACHE
              value: "/root/.cache/huggingface"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "1"
            - name: CUDA_VISIBLE_DEVICES
              value: "1"
          volumes:
          - name: ray-storage
            persistentVolumeClaim:
              claimName: ray-storage-pvc
