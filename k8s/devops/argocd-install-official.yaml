# ArgoCD Official Installation with DevOps Node Pool Affinity
# Download official manifest and add node selectors/tolerations

# First, install ArgoCD using official manifest:
# kubectl create namespace argocd
# kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

# Then apply this patch to move workloads to devops node pool:
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  template:
    spec:
      nodeSelector:
        workload: devops
      tolerations:
        - key: workload
          operator: Equal
          value: devops
          effect: NoSchedule
---
