# Default values for ray-serving-cluster.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# The KubeRay community welcomes PRs to expose additional configuration
# in this Helm chart.

namespace: kuberay-serving

image:
  repository: rayserve_test
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: "rayservice"
fullnameOverride: ""

imagePullSecrets: []
  # - name: an-existing-secret

serviceUnhealthySecondThreshold: 900 # Config for the health check threshold for Ray Serve applications. Default value is 900.
deploymentUnhealthySecondThreshold: 300 # Config for the health check threshold for Ray dashboard agent. Default value is 300.
serveConfigV2: |
  applications:
    - name: modelservice
      import_path: lng_ray_actors.generic_model_service.service
      deployments:
        - name: ModelService
          num_replicas: 1
          ray_actor_options:
            num_cpus: 1
            memory: 536870912
        - name: ModelDeployment
          num_replicas: 1
          ray_actor_options:
            num_cpus: 2
            memory: 2147483648

rayClusterConfig:
  rayVersion: 2.9.3
  head:
    sidecarContainers:
    - name: jupyterlab
      image:
      ports:
        - containerPort: 8888
      env:
        RAY_ADDRESS: ray://localhost:10001
      resources:
        limits:
          cpu: "200m"
          memory: "1Gi"
        requests:
          cpu: "200m"
          memory: "1Gi"
    labels: {}
    # Note: From KubeRay v0.6.0, users need to create the ServiceAccount by themselves if they specify the `serviceAccountName`
    # in the headGroupSpec. See https://github.com/ray-project/kuberay/pull/1128 for more details.
    serviceAccountName: ""
    rayStartParams:
      num-cpus: 0
      dashboard-host: '0.0.0.0'
    containerEnv: []
    ports:
      - containerPort: 6379
        name: gcs-server
      - containerPort: 8265 # Ray dashboard
        name: dashboard
      - containerPort: 10001
        name: client
      - containerPort: 8000
        name: serve
    # See https://docs.ray.io/en/latest/cluster/kubernetes/user-guides/config.html#resources
    # for further guidance.
    resources:
      limits:
        cpu: "1"
        # To avoid out-of-memory issues, never allocate less than 2G memory for the Ray head.
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "4Gi"
    annotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # Ray container security context.
    securityContext: {}
    # Optional: The following volumes/volumeMounts configurations are optional but recommended because
    # Ray writes logs to /tmp/ray/session_latests/logs instead of stdout/stderr.
    volumes: []
    # sidecarContainers specifies additional containers to attach to the Ray pod.
    # Follows standard K8s container spec.
    sidecarContainers: []
    # See docs/guidance/pod-command.md for more details about how to specify
    # container command for head Pod.
    command: []
    args: []
  worker:
    groupName: serviceworkergroup
    labels: {}
    serviceAccountName: ""
    rayStartParams: {}
    # containerEnv specifies environment variables for the Ray container,
    # Follows standard K8s container env schema.
    containerEnv: []
    # ports optionally allows specifying ports for the Ray container.
    ports: []
    # See https://docs.ray.io/en/latest/cluster/kubernetes/user-guides/config.html#resources
    # for further guidance.
    minReplicas: 1
    replicas: 1
    maxReplicas: 2
    resources:
      limits:
        cpu: "3"
        memory: "4Gi"
      requests:
        cpu: "3"
        memory: "4Gi"
    annotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # Ray container security context.
    securityContext: {}
    # Optional: The following volumes/volumeMounts configurations are optional but recommended because
    # Ray writes logs to /tmp/ray/session_latests/logs instead of stdout/stderr.
    volumes: []
    # sidecarContainers specifies additional containers to attach to the Ray pod.
    # Follows standard K8s container spec.
    sidecarContainers: []
    # See docs/guidance/pod-command.md for more details about how to specify
    # container command for worker Pod.
    command: []
    args: []
    lifecycle:
      preStop:
        exec:
          command: ["/bin/sh","-c","ray stop"]

# Configuration for Head's Kubernetes Service
service:
  # This is optional, and the default is ClusterIP.
  type: ClusterIP
  # Optional, for the user to provide any additional fields to the service.
  # See https://pkg.go.dev/k8s.io/Kubernetes/pkg/api/v1#Service
  # headService: {}

istio:
  gatewayNamespace: istio-ingress
  gateway: istio-kuberay-ingressgateway
  dnsPrefix: kuberay.4054-sk8s-mt-dev.sk8s.aws.lexis.com

sharedLogging:
  enabled: true
  storageClass: "gp2"
  size: "10Gi"
