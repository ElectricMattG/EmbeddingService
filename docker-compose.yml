version: '3.8'

services:
  embedding-service:
    image: embedding-service:latest
    container_name: embedding-service
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
