apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-cluster-simple
  namespace: default
spec:
  rayVersion: '2.39.0'
  headGroupSpec:
    serviceType: ClusterIP
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:2.39.0-py311
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 6379
            name: gcs
            protocol: TCP
          - containerPort: 8265
            name: dashboard
            protocol: TCP
          - containerPort: 10001
            name: client
            protocol: TCP
          - containerPort: 8000
            name: serve
            protocol: TCP
          resources:
            limits:
              cpu: "4"
              memory: "8Gi"
            requests:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
          - name: ray-storage
            mountPath: /mnt/ray-storage
          env:
          - name: RAY_STORAGE_PATH
            value: "/mnt/ray-storage"
        volumes:
        - name: ray-storage
          persistentVolumeClaim:
            claimName: ray-storage-pvc
  workerGroupSpecs:
  - groupName: worker-gpu
    replicas: 2
    minReplicas: 1
    maxReplicas: 4
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.39.0-py311-gpu
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: "6"
              memory: "12Gi"
              nvidia.com/gpu: "1"
            requests:
              cpu: "3"
              memory: "6Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: ray-storage
            mountPath: /mnt/ray-storage
          env:
          - name: RAY_STORAGE_PATH
            value: "/mnt/ray-storage"
          - name: NVIDIA_VISIBLE_DEVICES
            value: "all"
          - name: CUDA_VISIBLE_DEVICES
            value: "0"
        volumes:
        - name: ray-storage
          persistentVolumeClaim:
            claimName: ray-storage-pvc
